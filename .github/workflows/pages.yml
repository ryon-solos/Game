# Deploys the static front-end to GitHub Pages on every push to main.
# Pages serves static files only and cannot run the Node/WebSocket lobby in server.js:
# solo play runs entirely in the browser; multiplayer works when the GAME_SERVER
# repository variable points at a hosted server (see render.yaml).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: bash scripts/build-static.sh
        env:
          # optional repository variable (Settings > Secrets and variables > Actions > Variables):
          # the address of the multiplayer server, e.g. the-long-street.onrender.com
          GAME_SERVER: ${{ vars.GAME_SERVER }}
      - uses: actions/configure-pages@v5
        with:
          # Create the Pages site via the API if it does not exist yet,
          # so the repo needs no manual Settings change.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
